function drawWheel(aroma, target){
  const cx = 110, cy = 110, R = 88;
  const n = AROMA_AXES.length;
  const pt = (i, v) => {
    const ang = (-90 + i * (360 / n)) * Math.PI / 180;
    return [cx + R * v * Math.cos(ang), cy + R * v * Math.sin(ang)];
  };
  const poly = arr => arr.map(v => v.join(',')).join(' ');

  let g = '';
  [0.25, 0.5, 0.75, 1].forEach(k => {
    g += `<polygon points="${poly(AROMA_AXES.map((_, i) => pt(i, k)))}" fill="none" stroke="rgba(51,39,25,.13)" stroke-width="1"/>`;
  });
  AROMA_AXES.forEach((_, i) => {
    const [x, y] = pt(i, 1);
    g += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(51,39,25,.13)" stroke-width="1"/>`;
  });
  /* 罗盘式外框：双环 + 六向轴点 */
  g += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="rgba(51,39,25,.3)" stroke-width="1.2"/>`;
  g += `<circle cx="${cx}" cy="${cy}" r="${R + 5.5}" fill="none" stroke="rgba(51,39,25,.10)" stroke-width="1"/>`;
  AROMA_AXES.forEach((_, i) => {
    const [x, y] = pt(i, 1);
    g += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.1" fill="#a23e2b" fill-opacity=".5"/>`;
  });

  const tVals = AROMA_AXES.map(a => Math.min(1, (target[a] || 0) / 10));
  g += `<polygon points="${poly(AROMA_AXES.map((_, i) => pt(i, tVals[i])))}" fill="none" stroke="rgba(122,111,91,.55)" stroke-width="1.4" stroke-dasharray="4 3"/>`;

  const vals = AROMA_AXES.map(a => Math.min(1, (aroma[a] || 0) / 10));
  const anyAroma = vals.some(v => v > 0);
  g += `<polygon points="${poly(AROMA_AXES.map((_, i) => pt(i, vals[i])))}" fill="rgba(162,62,43,.16)" stroke="#a23e2b" stroke-width="1.8"/>`;

  AROMA_AXES.forEach((a, i) => {
    const [x, y] = pt(i, vals[i]);
    g += `<circle class="wheel-pt" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${anyAroma && vals[i] > 0 ? 4 : 2.4}" fill="#a23e2b"/>`;
    const [lx, ly] = pt(i, 1.16);
    g += `<text x="${lx.toFixed(1)}" y="${(ly + 4).toFixed(1)}" text-anchor="middle" font-size="12" font-family="KaiTi,STKaiti,serif" fill="rgba(51,39,25,.72)">${a}</text>`;
  });

  let centerTxt = '', centerSub = '';
  if(anyAroma){
    let mi = 0;
    vals.forEach((v, i) => { if(v > vals[mi]) mi = i; });
    const sum = vals.reduce((s, v) => s + v, 0) || 1;
    const purity = vals[mi] / sum;
    centerTxt = AROMA_AXES[mi];
    centerSub = purity > 0.45 ? '一味独大' : '尚匀';
    g += `<circle cx="${cx}" cy="${cy}" r="26" fill="rgba(255,253,246,.72)" stroke="${purity > 0.45 ? '#a23e2b' : 'rgba(51,39,25,.2)'}" stroke-width="1.2"/>`;
  }
  g += `<text class="wheel-center" x="${cx}" y="${cy + 2}" text-anchor="middle" font-size="20" fill="${anyAroma ? '#a23e2b' : 'rgba(51,39,25,.3)'}">${centerTxt || '—'}</text>`;
  if(centerSub) g += `<text x="${cx}" y="${cy + 17}" text-anchor="middle" font-size="10.5" fill="rgba(51,39,25,.6)">${centerSub}</text>`;

  g = `<g class="wheel-layer">${g}</g>`;
  $('wheel').innerHTML = g;
}

function drawLedger(res){
  const items = res.items.slice().sort((a, b) => Math.abs(b.got) - Math.abs(a.got));
  const shown = ledgerAll ? items : items.slice(0, SCORE_CFG.feedbackShowTop);
  $('ledger').innerHTML = shown.map(it => {
    const cls = it.level === 'good' ? 'good' : (it.level === 'bad' ? 'bad' : 'mid');
    const sign = it.got > 0 ? '+' : '';
    const delta = (it.max > 0) ? `${sign}${it.got.toFixed(1)}` : (it.got < 0 ? it.got.toFixed(1) : '—');
    return `<div class="lg-item">
      <div class="lg-bar ${cls}">${delta}</div>
      <div class="lg-body">
        <div class="lg-label">${esc(it.label)}</div>
        <div class="lg-text">${esc(it.text)}</div>
      </div>
    </div>`;
  }).join('') + (items.length > SCORE_CFG.feedbackShowTop
    ? `<div class="lg-more" id="lgMore">${ledgerAll ? '收起' : `查看全部判语（共 ${items.length} 条）`}</div>` : '');

  const lm = $('lgMore');
  if(lm) lm.onclick = () => { ledgerAll = !ledgerAll; drawLedger(res); };
}

function sell(orderId, res){
  /* 双重保险：槽位里的香草必须确有存货（页面按钮已拦，此处防异常路径） */
  if(SLOT_NAMES.some(r => blendDraft[r] && (state.inventory[blendDraft[r]] || 0) <= 0)){
    return toast('槽位中有香草已无存货，无法出售');
  }
  const pay = payoutOf(orderId, res.total);
  const order = ORDERS[orderId];
  let dayLines = [];
  mutate(s => {
    SLOT_NAMES.forEach(r => {
      const id = blendDraft[r];
      if(id){ s.inventory[id] = (s.inventory[id] || 0) - 1; if(s.inventory[id] <= 0) delete s.inventory[id]; }
    });
    /* 卖一炉香亦费一日光阴：与药圃「过一日」同一套天时结算 */
    dayLines = nextDay();
    s.money += pay;
    s.orders[orderId].done = (s.orders[orderId].done || 0) + 1;
    s.history.push({ id:'h' + Date.now(), orderId, score:res.total, grade:res.grade, stars:res.stars, day:s.day, payout:pay });
    s.stats.blends += 1;
    s.stats.best = Math.max(s.stats.best, res.total);
    s.stats.stars = (s.stats.stars || 0) + res.stars;
    s.stats.earned += pay;
    if(s.historyCards.indexOf(orderId) < 0) s.historyCards.push(orderId);
    addLog(`售出「${order.buyer}·${order.title}」，${res.total} 分，得钱 ${pay}。`);
  });
  blendDraft = { 君:null, 臣:null, 佐:null, 使:null };
  blendSel = '君'; ledgerAll = false;

  const hc = HISTORY_CARDS[orderId];
  const eventText = dayLines.slice(1).join('；');
  $('sc-blend').innerHTML = `
    <div class="gj-card">
      <div style="font-family:var(--kai);font-size:16px;letter-spacing:1.5px;margin-bottom:6px">
        ${esc(order.buyer)}收下香方
      </div>
      <div style="font-size:22px;letter-spacing:4px;margin-bottom:4px">${starHtml(res.stars)}</div>
      <div style="font-family:var(--serif);color:var(--seal);font-size:15px">${res.total} 分 · ${esc(res.grade)}</div>
      <div class="hint">得钱 <b style="color:var(--seal);font-family:var(--serif);font-size:16px">${pay}</b> 钱${res.total < SCORE_CFG.payout.refuseBelow ? '（买家勉强收下，只肯给半价）' : ''}。</div>
      <div class="hint" style="margin-top:8px">光阴又过一日，已是第 <b>${state.day}</b> 日。${eventText ? esc(eventText) + '。' : ''}</div>
      <div class="sep"></div>
      <h3 style="margin-top:0">历史小卡</h3>
      <div class="hint" style="color:var(--ink-2);line-height:1.85">${esc(hc)}</div>
      <div class="sep"></div>
      <div class="row">
        <button class="btn primary" id="btnNext">继续接单</button>
        <button class="btn ghost" id="btnCodex">看标本（香草志）</button>
        <button class="btn ghost" id="btnHub">回书斋</button>
      </div>
    </div>
  `;
  $('btnNext').onclick = () => { renderBlend(); };
  /* 出售是全局最重的一次「成交」：按分等放大反馈 */
  const big = res.total >= SCORE_CFG.payout.refuseBelow + 25 || res.stars >= 4;
  playTone(big ? 'big' : 'coin');
  FX.tier(big ? 'large' : 'medium', $('sc-blend').querySelector('.gj-card'), '+' + pay + ' 钱', 'up');
  $('btnHub').onclick = () => go('hub');
  $('btnCodex').onclick = () => {
    const id = Object.keys(state.known).find(k => state.known[k]);
    codexHerb = id || null;
    go('codex');
  };
}

    b.onclick = () => { codexHerb = b.dataset.h; renderCodex(); };
  });

  if(known && hasModel) initModelViewer(h);
}

/* 成就列表：已达成者列于前，未达成者给进度提示 */
function achCard(){
  const got = ACHIEVEMENTS.filter(a => state.ach[a.id]);
  const rest = ACHIEVEMENTS.filter(a => !state.ach[a.id]);
  const item = (a, on) => `
    <div class="ach ${on ? 'on' : 'off'}">
      <div class="an">${on ? '❖' : '○'} ${esc(a.name)}</div>
      <div class="ad">${esc(a.desc)}</div>
      <div class="ar ${on ? 'q-hi' : ''}" style="color:${on ? 'var(--seal)' : 'var(--muted)'}">
        ${on ? `已得 ${rewardText(a)}` : `奖励 ${rewardText(a)}`}
      </div>
    </div>`;
  const seedTotal = Object.keys(state.seeds).reduce((s, k) => s + state.seeds[k], 0);
  const extraAch = (window.XiangYe && XiangYe.ACH_EXTRA) ? XiangYe.ACH_EXTRA.length : 0;
  return `
    <div class="card">
      <h2>香道成就 · ${got.length} / ${ACHIEVEMENTS.length}${extraAch ? `<span style="font-size:12.5px;color:var(--muted);font-family:var(--sans);letter-spacing:0">　另有商道成就 ${extraAch} 项，见「成就」屏</span>` : ''}</h2>
      <div class="bar" style="margin-bottom:12px"><i style="width:${Math.round(got.length / ACHIEVEMENTS.length * 100)}%"></i></div>
      <div class="hint" style="margin-bottom:12px">
        识草、种药、合香、读经、答题皆有成就；读古籍所成者赏种子，其余赏钱。
        当前：识 ${Object.keys(state.known).filter(k => state.known[k]).length} 味 ·
        收获 ${state.stats.harvest || 0} 株 · 合香 ${state.stats.blends} 次 ·
        读经 ${state.readCards.length} / ${ANCIENT_CARDS.length} 张 · 答对 ${state.stats.quizRight || 0} 题 · 种子 ${seedTotal} 枚
      </div>
      <div class="ach-grid">
        ${got.map(a => item(a, true)).join('')}
        ${rest.map(a => item(a, false)).join('')}
      </div>
    </div>`;
}

/* ============================================================
   =10.5 SCREEN · quiz 香料问答
   ============================================================ */
function renderQuiz(){
  if(!quizRun) quizRun = { qs:[], i:0, picked:[], done:false };
  const left = quizLeftToday();

  if(!quizRun.qs.length){
    const st = state.stats;
    const acc = (st.quizRight || 0) + (st.quizWrong || 0);
    $('sc-quiz').innerHTML = `
      <div class="card flat" style="padding:12px 16px">
        <div class="row">
          <button class="btn sm ghost" id="btnBackQuiz">← 回到书斋</button>
          <div class="spacer"></div>
          <span class="hint">香料问答</span>
        </div>
      </div>

      ${quizRun.done && !left ? `
      <div class="gj-card">
        <div style="font-family:var(--kai);font-size:16px;letter-spacing:1.5px;margin-bottom:6px">本轮结束</div>
        <div style="font-size:22px;letter-spacing:4px;margin-bottom:4px">${starHtml(quizRun.right >= 5 ? 3 : (quizRun.right >= 4 ? 2 : (quizRun.right >= 3 ? 1 : 0)))}</div>
        <div style="font-family:var(--serif);color:var(--seal);font-size:15px">答对 ${quizRun.right} / ${QUIZ_LEN} 题</div>
        <div class="hint">得钱 <b style="color:var(--seal);font-family:var(--serif);font-size:16px">${quizRun.pay}</b> 钱${quizRun.right === QUIZ_LEN ? `（含全对重赏 ${QUIZ_PERFECT} 钱）` : ''}。</div>
        <div class="sep"></div>
        <div class="row">
          <button class="btn ghost" id="btnQuizHub">回书斋</button>
        </div>
      </div>` : ''}

      ${quizRun.expired && left ? `
      <div class="card flat" style="border-color:var(--warn)">
        <div class="hint" style="color:var(--warn)">昨日未竟的一卷问答已随旧日历翻篇，今日可重开一轮。</div>
      </div>` : ''}

      <div class="card">
        <h2>香料问答</h2>
        <div class="hint">
          题目出自「香草志」「读古籍」与号簿所载——生境、学名、成分、药性、典籍出处，
          兼及行价贵贱、商路里程、编年大事与农时。出题优先未读过的，读过方回头温习。<br/>
          一轮 ${QUIZ_LEN} 题，每题三至五选一（依题而定）；答对得 ${QUIZ_REWARD} 钱，全对另赏 ${QUIZ_PERFECT} 钱。
        </div>
        <div class="sep"></div>
        <div class="row" style="font-size:13px">
          <span class="chip">累计答对 <b>${st.quizRight || 0}</b> 题</span>
          <span class="chip">正确率 <b>${acc ? Math.round((st.quizRight || 0) / acc * 100) : 0}%</b></span>
          <span class="chip">全对 <b>${st.quizPerfect || 0}</b> 轮</span>
        </div>
        <div class="sep"></div>
        ${left
          ? `<button class="btn primary" id="btnQuizStart">开始答题（${QUIZ_LEN} 题）</button>`
          : `<div class="hint">今日已答过一轮。去药圃「过一日」，明日再来。</div>
             <div class="row" style="margin-top:10px">
               <button class="btn primary sm" id="btnQuizGarden">去药圃过一日</button>
             </div>`}
      </div>
    `;
    $('btnBackQuiz').onclick = () => go('hub');
    const bs = $('btnQuizStart'); if(bs) bs.onclick = () => startQuiz();
    const bh = $('btnQuizHub'); if(bh) bh.onclick = () => go('hub');
    const bg = $('btnQuizGarden'); if(bg) bg.onclick = () => go('garden');
    return;
  }

  const cur = quizRun.qs[quizRun.i];
  const pickedIdx = quizRun.picked[quizRun.i];
  const answered = typeof pickedIdx === 'number';
  /* 标号须容得下最多选项：行价题问「五城何处最贱」即五选一 */
  const keys = ['甲','乙','丙','丁','戊'];

  $('sc-quiz').innerHTML = `
    <div class="card flat" style="padding:12px 16px">
      <div class="row">
        <button class="btn sm ghost" id="btnBackQuizQ">← 回到书斋</button>
        <div class="spacer"></div>
        <span class="hint">第 ${quizRun.i + 1} / ${QUIZ_LEN} 题</span>
      </div>
    </div>

    <div class="card">
      <div class="quiz-head">
        <span class="chip">已答对 <b>${quizRun.picked.filter((p, k) => p === quizRun.qs[k].ans).length}</b> 题</span>
        <span class="chip">每题 ${QUIZ_REWARD} 钱</span>
      </div>
      <div class="quiz-dots">
        ${quizRun.qs.map((q, k) => {
          const p = quizRun.picked[k];
          const cls = typeof p !== 'number' ? (k === quizRun.i ? 'cur' : '') : (p === q.ans ? 'ok' : 'no');
          return `<span class="quiz-dot ${cls}"></span>`;
        }).join('')}
      </div>
      <div class="sep"></div>
      <div class="quiz-q">${esc(cur.q)}</div>
      <div class="quiz-opts" id="quizOpts">
        ${cur.opts.map((o, k) => {
          let cls = '';
          if(answered){
            if(k === cur.ans) cls = 'ok';
            else if(k === pickedIdx) cls = 'no';
          }
          return `<button class="quiz-opt ${cls}" data-k="${k}" ${answered ? 'disabled' : ''}>
            <span class="k">${keys[k]}</span>${esc(o)}</button>`;
        }).join('')}
      </div>
      <div id="quizFb" style="margin-top:14px"></div>
    </div>
  `;

  $('btnBackQuizQ').onclick = () => go('hub');
  $('quizOpts').querySelectorAll('[data-k]').forEach(b => {
    b.onclick = () => answerQuiz(+b.dataset.k);
  });

  if(answered){
    const ok = pickedIdx === cur.ans;
    $('quizFb').innerHTML = `
      <div class="card flat" style="margin:0;border-color:${ok ? 'var(--good)' : 'var(--bad)'}">
        <div style="font-family:var(--kai);font-size:15px;letter-spacing:1px;color:${ok ? 'var(--good)' : 'var(--bad)'}">
          ${ok ? `答对了 · 得钱 ${QUIZ_REWARD}` : `答错了 · 正解为「${esc(cur.opts[cur.ans])}」`}
        </div>
        <div class="hint" style="margin-top:6px">${esc(cur.why)}</div>
        <div class="sep"></div>
        <button class="btn primary sm" id="btnQuizNext">${quizRun.i + 1 >= QUIZ_LEN ? '看本轮结果' : '下一题'}</button>
      </div>`;
    $('btnQuizNext').onclick = () => {
      if(quizRun.i + 1 >= QUIZ_LEN) finishQuiz();
      else { quizRun.i += 1; persistQuiz(); renderQuiz(); }
    };
  }
}

function answerQuiz(k){
  const cur = quizRun.qs[quizRun.i];
  if(typeof quizRun.picked[quizRun.i] === 'number') return;
  quizRun.picked[quizRun.i] = k;
  const ok = k === cur.ans;
  mutate(s => {
    s.quiz = quizRun;
    if(ok){ s.money += QUIZ_REWARD; s.stats.earned += QUIZ_REWARD; s.stats.quizRight = (s.stats.quizRight || 0) + 1; }
    else { s.stats.quizWrong = (s.stats.quizWrong || 0) + 1; }
  });
}

function finishQuiz(){
  const right = quizRun.qs.reduce((n, q, k) => n + (quizRun.picked[k] === q.ans ? 1 : 0), 0);
  const bonus = right === QUIZ_LEN ? QUIZ_PERFECT : 0;
  const pay = right * QUIZ_REWARD + bonus;
  quizRun = { qs:[], i:0, picked:[], done:true, right, pay };
  mutate(s => {
    s.quiz = quizRun;
    if(bonus){
      s.money += bonus;
      s.stats.earned += bonus;
      s.stats.quizPerfect = (s.stats.quizPerfect || 0) + 1;
    }
  });
}

async function initModelViewer(h){
  const mv = $('mv');
  if(!mv) return;
  try{
    const MV = await import('./shared/model-viewer.min.js');
    const MVE = MV.ModelViewerElement || MV.default;
    if(MVE) MVE.dracoDecoderLocation = 'shared/draco/';
  }catch(e){ toast('3D 组件加载失败'); return; }

  /* 素材路径由商道层素材谱给出（无模型者不会走到这里）；备用通道仍走 CDN */
  const PRIMARY = h.modelPath || `models/${h.model}.glb`;
  const FALLBACK = (() => {
    const rel = PRIMARY.replace(/^\.\//, '');
    if(/^\.\.\//.test(rel)) return `https://cdn.jsdelivr.net/gh/ruijiangyoumeile/spice3d@main/${rel.replace(/^\.\.\//, '')}`;
    return `https://cdn.jsdelivr.net/gh/ruijiangyoumeile/spice3d@main/hexiang/${rel}`;
  })();
  const fill = $('loadFill'), txt = $('loadTxt');
  let switched = false;
  let loaded = false;

  mv.addEventListener('progress', e => {
    if(!fill || loaded || mv.dataset.released) return;   // 已加载完成或已释放时不再更新
    const p = e.detail && e.detail.totalProgress;
    if(typeof p === 'number' && p > 0){
      fill.style.width = Math.round(p * 100) + '%';
      if(txt) txt.textContent = `正在展开图页… 已展 ${Math.round(p * 100)}%`;
    }
  });
  mv.addEventListener('load', () => {
    if(mv.dataset.released) return;
    loaded = true;
    if(fill) fill.style.width = '100%';
    if(txt) txt.textContent = '图页已展 · 可拖动旋转';
    const slot = $('modelStage')?.querySelector('.ar-slot');
    if(slot && window.initSpiceAR) slot.hidden = false;
  });
  mv.addEventListener('error', () => {
    if(mv.dataset.released) return;   // 主动释放导致的 error，不切备用通道
    if(!switched){ switched = true; mv.setAttribute('src', FALLBACK); return; }
    if(txt) txt.textContent = '图页加载失败，请检查 models 目录';
    toast('3D 标本加载失败');
  });

  mv.setAttribute('src', PRIMARY);

  /* 4 秒无进度则切备用通道 */
  const watchdog = setTimeout(() => {
    if(mv.dataset.released) return;
    const w = parseFloat(fill && fill.style.width) || 0;
    if(w < 8){ switched = true; mv.setAttribute('src', FALLBACK); }
  }, 4000);
  mv.addEventListener('load', () => clearTimeout(watchdog), { once:true });

  if(window.initSpiceAR){
    window.initSpiceAR({
      viewer: mv,
      primary: PRIMARY,
      usdz: PRIMARY.replace(/\.glb$/, '.usdz'),
      restoreShadow: '0.35',
      toast: toast,
      host: $('modelStage'),
      els:{
        btnAR: $('btnAR'), arSheet: $('arSheet'), arBrowser: $('arBrowser'),
        arLaunch: $('arLaunch'), arAdvice: $('arAdvice'), arCopy: $('arCopy'),
        arClose: $('arClose'), arScene: $('arScene'),
        camAR: $('camAR'), camVideo: $('camVideo'), camStage: $('camStage'), camExit: $('camExit')
      }
    });
  }
}

/* ============================================================
   =13 TEST HOOK —— 依 develop-web-game 的明文要求
     · render_game_to_text：把状态文本化，测试/无障碍/调试皆可读
     · advanceTime：本作为回合制（无逐帧模拟），故语义定为
       「把视觉层推到静息」，让断言发生在确定性时刻而非真实时钟
   ============================================================ */
window.render_game_to_text = function(){
  const co = state.co || {};
  const inv = {};
  Object.keys(state.inventory).forEach(k => { if(state.inventory[k]) inv[k] = state.inventory[k]; });
  const seedKinds = Object.keys(state.seeds).filter(k => state.seeds[k] > 0);
  const plots = { total:0 };
  if(co.plots) Object.keys(co.plots).forEach(c => { plots[c] = (co.plots[c] || []).length; plots.total += plots[c]; });
  return JSON.stringify({
    screen: state.screen, day: state.day, money: state.money,
    seeds: { kinds: seedKinds.length, total: seedKinds.reduce((n,k) => n + state.seeds[k], 0) },
    inventory: inv,
    known: Object.keys(state.known).filter(k => state.known[k]).length,
    ripe: state.plants.filter(p => p.ready).length,
    achievements: Object.keys(state.ach).length,
    co: { fame: co.fame || 0, trips: co.trips || 0, transit: (co.transit || []).length,
          shops: co.shops ? Object.keys(co.shops).filter(c => co.shops[c]) : [], plots: plots },
    settings: { shake: state.settings.shake, sound: state.settings.sound, reduceMotion: state.settings.reduceMotion }
  });
};
window.advanceTime = function(ms){
  const steps = Math.max(1, Math.round((ms || 16.7) / 16.7));
  for(let i = 0; i < steps; i++) FX.settle();
  return window.render_game_to_text();
};
